version: '3.8'
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - monitoring-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring-network

  redis:
    image: redis:latest
    container_name: expo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitoring-network

  postgres:
    image: postgres:latest
    container_name: expo-postgres
    restart: always
    environment:
      POSTGRES_DB: expo
      POSTGRES_USER: expo
      POSTGRES_PASSWORD: expo1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring-network

networks:
  monitoring-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  postgres_data: